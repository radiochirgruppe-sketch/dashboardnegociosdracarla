name: Deploy Dashboard para GitHub Pages

on:
  push:
    branches: [claude/unified-metrics-dashboard-xgv59, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BEEHIIV_API_KEY: ${{ secrets.VITE_BEEHIIV_API_KEY }}
          VITE_BEEHIIV_PUBLICATION_MEDICINA: ${{ secrets.VITE_BEEHIIV_PUBLICATION_MEDICINA }}
          VITE_BEEHIIV_PUBLICATION_DESAFIOS: ${{ secrets.VITE_BEEHIIV_PUBLICATION_DESAFIOS }}
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
